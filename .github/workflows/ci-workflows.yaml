name: Falsk-CI-Worlflow
on:
  push: 

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      
      # - name: validate the repository
      #   run: |
      #     pwd
      #     ls -la
      #     find . -maxdepth 4 -type f -name "Dockerfile" -print
      
      - name: docker image build
        run: |
          cd projectfiles
          docker build -t flask-github:v1.0 .
      
      - name: list out images
        run: docker images
      
      - name: Run Container
        run: docker run -d -p 5000:5000 --name flask-gihub-container flask-github:v1.0
      - name: healthcheck
        run: |
          sleep 5
          curl http://localhost:5000/health

        
