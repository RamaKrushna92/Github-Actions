name: ci-pr-workflow
on: 
  pull_request:
    types:
      - opened
    branches: 
      - main
    paths: 
      - 'app/**'
  push:
    branches: 
      - 'feature/**'
    paths: 
      - 'app/**'
jobs:
  execute-shell-python-job:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/merge-branch

      - name: print the currect dir details
        run: |
          pwd

      - name: execute the shell file
        run: app.sh
        working-directory: app
      - name: execute the python file
        run: app.py
        working-directory: app

      
